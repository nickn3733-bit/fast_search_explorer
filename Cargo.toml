[package]
name = "fast_file_search"
version = "0.1.0"
edition = "2021"
authors = ["nickn3733-bit"]
description = "Надшвидкий пошуковик файлів для Windows на Rust (eframe/egui + Rayon + jwalk + bincode)"

[dependencies]
# Графічний інтерфейс egui + eframe
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }

# Багатопотоковий паралельний пошук Rayon
rayon = "1.10"

# Багатопотоковий паралельний обхід дисків
jwalk = "0.8"

# Швидка серіалізація кешу індексу на диск
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Форматування дати та часу
chrono = "0.4"

# Відкриття файлів через системні асоціації
open = "5.3"

# Безпечне видалення в Кошик Windows
trash = "5"

[target.'cfg(windows)'.dependencies]
# Визначення логічних дисків Windows через системний bitmask
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

# Максимальна оптимізація швидкодії
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
